name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please don't file them here; see SECURITY.md.
        Before pasting logs, remove passwords, hostnames or paths you'd rather not share.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows]
    validations:
      required: true
  - type: input
    id: osver
    attributes:
      label: OS version
      placeholder: Ubuntu 24.04 / Windows 11 24H2
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Restic Console (bottom left of the app), restic (`restic version`), Python (`python3 --version`)
      placeholder: Restic Console 0.2.0, restic 0.18.1, Python 3.12.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The run's log from Run history, or the service log:
        Linux `journalctl -u restic-console -n 100`; Windows: Task Scheduler > ResticConsole > Server > History.
      render: text
