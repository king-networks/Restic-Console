<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restic Console</title>
<link rel="icon" href="icon.svg">
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f8f9fb; --line: #e2e5ea; --text: #1b1f24; --muted: #5f6b7a;
  --accent: #2f6fde; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --info: #2f6fde;
  --ok-bg: #e5f4ec; --warn-bg: #fbf1de; --bad-bg: #fbe6e6; --info-bg: #e6eefc;
  --code-bg: #0f1419; --code-ink: #d7dde4; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --panel-2: #1c2128; --line: #2a313a; --text: #e6e9ee; --muted: #93a0b0;
    --accent: #5b8ff0; --accent-ink: #0b1220; --ok: #4cc382; --warn: #e3a744; --bad: #f07070; --info: #6f9ff2;
    --ok-bg: #16301f; --warn-bg: #352a14; --bad-bg: #3a1a1a; --info-bg: #182640;
    --code-bg: #0b0e12; --code-ink: #cfd6de; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 210px 1fr; height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; padding: 4px 10px 16px; }
nav .brand img { width: 26px; height: 26px; }
nav a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; cursor: pointer; }
nav a:hover { background: var(--panel-2); color: var(--text); }
nav a.on { background: var(--info-bg); color: var(--accent); font-weight: 600; }
nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
nav .foot { margin-top: auto; padding: 10px 12px; font-size: 12px; color: var(--muted); word-break: break-all; }
main { overflow: auto; padding: 22px 28px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; }
h3 { font-size: 12px; margin: 16px 0 8px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sub { color: var(--muted); margin: 0 0 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.stack > .card + .card { margin-top: 14px; }
.k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.v { font-size: 18px; font-weight: 650; }
.meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); background: var(--ok-bg); } .chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); } .chip.info { color: var(--info); background: var(--info-bg); }
.chip.muted { color: var(--muted); background: var(--panel-2); }
.dots { display: flex; gap: 3px; margin-top: 12px; min-height: 16px; }
.dots i { width: 9px; height: 16px; border-radius: 3px; background: var(--line); }
.dots i.success { background: var(--ok); } .dots i.warning { background: var(--warn); } .dots i.failed { background: var(--bad); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nw { white-space: nowrap; }
.mono { font-family: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; }
pre.log { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; margin: 0; max-height: 60vh; overflow: auto; font: 12px/1.5 ui-monospace, "DejaVu Sans Mono", monospace; white-space: pre-wrap; word-break: break-all; }
pre.log .w { color: #e3a744; } pre.log .e { color: #f07070; } pre.log .d { color: #4cc382; }
input[type=text], input[type=number], input[type=time], input[type=password], input[type=email], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; border-color: var(--accent); }
input:disabled { opacity: .6; }
textarea { width: 100%; min-height: 180px; font: 12.5px/1.5 ui-monospace, "DejaVu Sans Mono", monospace; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.f > input, label.f > select, label.f > textarea { color: var(--text); }
label.cb { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.form-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; font-size: 13.5px; }
.crumbs a { color: var(--accent); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.crumbs a:hover { background: var(--info-bg); }
.icon { width: 18px; display: inline-block; text-align: center; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); } .banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--info); }
.bar { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); margin-top: 8px; }
.bar > div { height: 100%; background: var(--accent); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; width: min(620px, 92vw); max-height: 88vh; overflow: auto; }
.modal h2 { margin-bottom: 6px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 20; max-width: 460px; }
.toast.bad { background: var(--bad); color: #fff; }
.list-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 5px 0; }
.list-row input { width: 100%; }
.mono-in { font-family: ui-monospace, monospace; }
.next-list { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days label { border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12.5px; user-select: none; }
.days input { display: none; }
.days label:has(input:checked) { border-color: var(--accent); background: var(--info-bg); color: var(--accent); font-weight: 650; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.tabs button.on { background: var(--info-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.login { max-width: 460px; margin: 12vh auto; }
.secret { font-family: ui-monospace, monospace; background: var(--panel-2); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; word-break: break-all; user-select: all; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; } nav { flex-direction: row; flex-wrap: wrap; } nav .brand, nav .foot, nav .sep { display: none; } main { padding: 16px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const B = n => { if (n == null || isNaN(n)) return "–"; const u = ["B","KiB","MiB","GiB","TiB"]; let i = 0; n = +n; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 2 : 1) : n) + " " + u[i]; };
const toDate = t => t == null ? null : (typeof t === "number" ? new Date(t * 1000) : new Date(t));
const fmtTime = t => { const d = toDate(t); return d && !isNaN(d) ? d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–"; };
const rel = t => { const d = toDate(t); if (!d) return ""; const s = (d - Date.now()) / 1000, a = Math.abs(s);
  const f = a < 90 ? Math.round(a) + "s" : a < 5400 ? Math.round(a / 60) + " min" : a < 129600 ? Math.round(a / 3600) + " h" : Math.round(a / 86400) + " days";
  return s < 0 ? f + " ago" : "in " + f; };
const dur = s => { if (s == null || isNaN(s)) return "–"; s = Math.round(s); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60; return (h ? h + "h " : "") + (h || m ? m + "m " : "") + x + "s"; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);

let S = { view: "overview", cfg: null };
const P = () => (S.cfg && S.cfg.platform) || S.hello || { name: "linux", features: {}, sep: "/", keys_dir: "", token_file: "" };
const WIN = () => P().name === "windows";
const isLocal = p => WIN() ? /^([A-Za-z]:[\\/]|\\\\)/.test(p) : p.startsWith("/");
let timers = [];
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  let j = null; try { j = await r.json(); } catch { }
  if (r.status === 401 && path !== "/api/login") { renderLogin(); throw new Error("not logged in"); }
  if (!r.ok) throw new Error((j && j.error) || r.statusText);
  return j;
}
const loadCfg = async () => (S.cfg = await api("/api/config"));
function toast(msg, bad) { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 3200); }
const fail = e => { if (e.message !== "not logged in") toast(e.message, true); };

function modal(html, onMount) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener("mousedown", e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg); onMount && onMount(bg.firstChild, () => bg.remove()); return bg;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => modal(`<h2>${esc(title)}</h2><p class="sub">${text}</p><div class="row"><span class="spacer"></span>
    <button class="btn" data-x>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-ok>${esc(okLabel)}</button></div>`,
    (m, close) => { $("[data-x]", m).onclick = () => { close(); res(false); }; $("[data-ok]", m).onclick = () => { close(); res(true); }; }));
}
function askBox(title, text, value) {
  return new Promise(res => modal(`<h2>${esc(title)}</h2><p class="sub">${text}</p><input type="text" id="ask" style="width:100%" value="${esc(value)}">
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>OK</button></div>`,
    (m, close) => { $("#ask", m).focus(); $("[data-x]", m).onclick = () => { close(); res(null); }; $("[data-ok]", m).onclick = () => { const v = $("#ask", m).value; close(); res(v); }; }));
}
function statusChip(st) {
  const m = { success: ["ok","Succeeded"], warning: ["warn","Warnings"], failed: ["bad","Failed"], running: ["info","Running"],
    stopped: ["muted","Stopped"], unknown: ["muted","No runs yet"], done: ["ok","Done"], cancelled: ["muted","Cancelled"], queued: ["muted","Queued"], disabled: ["muted","Disabled"] }[st] || ["muted", st];
  return `<span class="chip ${m[0]}">${m[1]}</span>`;
}
const colorLine = m => { const c = /ERROR|Fatal|error:/i.test(m) ? "e" : /WARNING|warning/.test(m) ? "w" : /DONE|no errors were found|saved$/.test(m) ? "d" : ""; return c ? `<span class="${c}">${esc(m)}</span>` : esc(m); };
const destName = id => ((S.cfg && S.cfg.destinations[id]) || {}).name || id;

const VIEWS = [["overview","Overview"],["jobs","Backup jobs"],["destinations","Destinations"],["snapshots","Snapshots"],["runs","Run history"],["activity","Activity"],["sep"],["settings","Settings"]];
const PARENT = { jobedit: "jobs", browse: "snapshots", runlog: "runs", task: "activity" };
function shell() {
  $("#root").innerHTML = `<div class="app"><nav><div class="brand"><img src="icon.svg" alt="">Restic Console</div>
    ${VIEWS.map(([id, n]) => id === "sep" ? `<div class="sep"></div>` : `<a data-v="${id}">${n}</a>`).join("")}<div class="foot"><span id="foot">${esc(S.cfg.host)}</span><br><span style="opacity:.8">v${esc(P().version || "")}</span> · <a id="logout" style="display:inline;padding:0;color:var(--muted);text-decoration:underline">Sign out</a></div></nav><main id="main"></main></div>`;
  $$("nav a[data-v]").forEach(a => a.onclick = () => go(a.dataset.v));
  $("#logout").onclick = async () => { try { await api("/api/logout", {}); } catch (e) { } renderLogin(); };
}
function go(view, arg) {
  clearTimers(); S.view = view;
  if (VIEWS.some(v => v[0] === view)) history.replaceState(null, "", "#" + view);
  $$("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view || PARENT[view] === a.dataset.v));
  ({ overview, jobs, jobedit, destinations, snapshots, browse, runs, runlog, activity, task: taskView, settings: settingsView })[view](arg);
  main().scrollTop = 0;
}
const main = () => $("#main");

/* ================================================================ overview */
async function overview() {
  main().innerHTML = `<h1>Overview</h1><p class="sub">Loading…</p>`;
  const draw = async () => {
    let st; try { [st] = await Promise.all([api("/api/status"), loadCfg()]); } catch (e) { return fail(e); }
    if (S.view !== "overview") return;
    $("#foot").innerHTML = `${esc(st.host)}${st.dev ? "<br><b>DEV MODE</b>" : ""}`;
    const offline = st.destinations.filter(d => !d.health.reachable);
    const failing = st.jobs.filter(j => j.last && j.last.status === "failed" && !j.running);
    main().innerHTML = `
      <div class="row"><h1>Overview</h1><span class="spacer"></span><button class="btn" id="newjob">+ New backup job</button></div>
      <p class="sub">${st.jobs.length} job${st.jobs.length === 1 ? "" : "s"} on ${esc(st.host)} · ${st.destinations.length} destination${st.destinations.length === 1 ? "" : "s"}</p>
      ${offline.map(d => `<div class="banner bad">⚠ ${esc(d.name)} is unavailable: ${esc(d.health.error)}. Jobs that back up there will fail until it is back.</div>`).join("")}
      ${failing.map(j => `<div class="banner bad">✗ Last run of <b>${esc(j.name)}</b> failed ${rel(j.last.end)}${j.last.error_msg ? ": " + esc(j.last.error_msg.replace(/^\[[^\]]+\]\s*/, "")) : ""}</div>`).join("")}
      ${!st.jobs.length ? `<div class="card empty" style="margin-bottom:18px">No backup jobs yet. ${st.destinations.length ? "" : "Add a destination first, then "}create a job.</div>` : ""}
      <div class="grid">${st.jobs.map(jobCard).join("")}</div>
      <h2>Storage</h2>
      <div class="grid">${st.destinations.map(d => destCard(d, false)).join("") || `<div class="card empty">No destinations.</div>`}
        ${st.raid.map(a => `<div class="card"><div class="row"><h2 style="margin:0">Disk array ${esc(a.name)}</h2>${a.have === a.want ? `<span class="chip ok">Healthy</span>` : `<span class="chip bad">Degraded ${a.have}/${a.want}</span>`}</div>
          <div class="meta">${esc(a.level)} <span class="mono">[${esc(a.map)}]</span> · ${a.members.map(esc).join(", ")}</div>${a.progress ? `<div class="meta">${esc(a.progress.op)} ${a.progress.pct}% (ETA ${esc(a.progress.eta)})</div>` : ""}</div>`).join("")}</div>`;
    $("#newjob").onclick = () => go("jobedit", null);
    bindJobCards();
  };
  await draw();
  timers.push(setInterval(() => { if (!document.hidden) draw(); }, 10000));
}
function jobCard(j) {
  const last = j.last, st = j.running ? "running" : !j.enabled ? "disabled" : last ? last.status : "unknown";
  return `<div class="card"><div class="row"><h2 style="margin:0">${esc(j.name)}</h2>${statusChip(st)}</div>
    <div class="meta mono" style="margin-top:6px">${j.sources.map(esc).join(" · ")}</div>
    <div class="meta">→ ${esc(destName(j.destination))}</div>
    <div class="two"><div><div class="k">Last run</div>${last ? `<b>${rel(last.end)}</b><div class="meta">${last.added ? "added " + esc(last.added[0]) : ""}</div>` : `<b>Never</b>`}</div>
      <div><div class="k">Next run</div><b>${j.enabled && j.next ? rel(j.next) : j.enabled ? "–" : "Paused"}</b><div class="meta">${j.enabled && j.next ? fmtTime(j.next) : ""}</div></div></div>
    <div class="dots" title="Recent runs, oldest first">${j.recent.slice().reverse().map(s => `<i class="${s}"></i>`).join("")}</div>
    <div class="row" style="margin-top:12px">${j.running ? `<button class="btn sm danger" data-stop="${j.id}">Stop</button><button class="btn sm" data-live="${j.id}" data-inv="${j.running}">Live log</button>`
      : `<button class="btn sm primary" data-run="${j.id}">Run now</button>`}<button class="btn sm" data-hist="${j.id}">History</button><span class="spacer"></span><button class="btn sm" data-edit="${j.id}">Edit</button></div></div>`;
}
function bindJobCards() {
  $$("[data-run]").forEach(b => b.onclick = async () => { b.disabled = true; try { await api("/api/job/run", { id: b.dataset.run }); toast("Backup started"); setTimeout(() => go(S.view), 900); } catch (e) { fail(e); b.disabled = false; } });
  $$("[data-stop]").forEach(b => b.onclick = async () => {
    if (!await confirmBox("Stop this backup?", "restic stops; this run's snapshot is not saved. A stale lock may remain (Destinations → Remove stale locks).", "Stop", true)) return;
    try { await api("/api/job/stop", { id: b.dataset.stop }); toast("Stopping…"); setTimeout(() => go(S.view), 1500); } catch (e) { fail(e); } });
  $$("[data-edit]").forEach(b => b.onclick = () => go("jobedit", b.dataset.edit));
  $$("[data-hist]").forEach(b => b.onclick = () => go("runs", b.dataset.hist));
  $$("[data-live]").forEach(b => b.onclick = () => go("runlog", { job: b.dataset.live, id: b.dataset.inv }));
}
function destCard(d, actions) {
  const h = d.health, jobNames = d.jobs.map(id => (S.cfg.jobs[id] || {}).name || id);
  return `<div class="card"><div class="row"><h2 style="margin:0">${esc(d.name)}</h2>${h.reachable ? `<span class="chip ok">Online</span>` : `<span class="chip bad">Offline</span>`}</div>
    <div class="meta mono" style="margin-top:4px">${esc(d.repo)}</div>
    ${h.df ? `<div class="bar"><div style="width:${(h.df.used / h.df.size * 100).toFixed(1)}%"></div></div><div class="meta">${B(h.df.avail)} free of ${B(h.df.size)}</div>` : h.error ? `<div class="meta">${esc(h.error)}</div>` : ""}
    <div class="meta">Jobs: ${jobNames.length ? jobNames.map(esc).join(", ") : "none"}</div>
    ${actions ? `<h3>Maintenance</h3><div class="row" style="gap:6px">
      <button class="btn sm" data-snaps="${d.id}">Snapshots</button><button class="btn sm" data-task="check" data-d="${d.id}">Check</button>
      <button class="btn sm" data-task="check_data" data-d="${d.id}">Deep check…</button><button class="btn sm" data-task="stats" data-d="${d.id}">Size</button>
      <button class="btn sm" data-task="prune" data-d="${d.id}">Prune</button><button class="btn sm" data-task="unlock" data-d="${d.id}">Remove stale locks</button></div>

const DEV_EXCLUDES = `# Regenerable build output and dependencies
**/node_modules
**/.venv
**/venv
**/__pycache__
**/.pytest_cache
**/.mypy_cache
**/target
**/dist
**/build
**/.next
**/.cache
**/*.pyc
`;
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function scheduleBuilder(el, cals) {
  el.innerHTML = `<div id="cl"></div><button class="btn sm" id="addc" style="margin-top:6px">+ Add another time</button>
    <h3>Quick builder</h3>
    <div class="tabs" id="mode"><button data-m="hours" class="on">Every N hours</button><button data-m="minutes">Every N minutes</button><button data-m="daily">Daily</button><button data-m="weekly">Weekly</button></div>
    <div class="row" id="bld" style="align-items:flex-end"></div>
    <div class="row" style="margin-top:10px"><span class="mono meta" id="bexpr"></span><span class="spacer"></span><button class="btn sm" id="badd">Add</button><button class="btn sm primary" id="brep">Use only this</button></div>`;
  const drawList = () => {
    const ro = !P().features.custom_calendar;
    $("#cl", el).innerHTML = (ro ? `<div class="meta" style="margin-bottom:4px">On Windows, schedules are made with the quick builder below.</div>` : "") + cals.map((c, i) => `<div class="list-row"><div><input type="text" class="mono-in" value="${esc(c)}" data-c="${i}" ${ro ? "readonly" : ""}><div class="next-list" id="nx${i}">…</div></div>
      <button class="btn sm danger" data-rmc="${i}" ${cals.length < 2 ? "disabled" : ""}>Remove</button></div>`).join("");
    cals.forEach((c, i) => preview(i));
    $$("[data-c]", el).forEach(inp => { let t; inp.oninput = () => { cals[+inp.dataset.c] = inp.value; clearTimeout(t); t = setTimeout(() => preview(+inp.dataset.c), 400); }; });
    $$("[data-rmc]", el).forEach(b => b.onclick = () => { cals.splice(+b.dataset.rmc, 1); drawList(); });
  };
  const preview = async i => {
    const p = $("#nx" + i, el); if (!p) return;
    try { const r = await api(`/api/calendar?n=4&expr=${encodeURIComponent(cals[i])}`); p.textContent = "Next: " + r.next.map(n => fmtTime(n.epoch)).join(" · "); p.style.color = ""; }
    catch (e) { p.textContent = "✗ " + e.message; p.style.color = "var(--bad)"; }
  };
  let mode = "hours";
  const bld = () => {
    $("#bld", el).innerHTML = mode === "hours" ? `<label class="f">Every<select id="bh">${[1,2,3,4,6,8,12].map(h => `<option ${h === 1 ? "selected" : ""}>${h}</option>`).join("")}</select></label><label class="f">hours, at minute<input type="number" id="bm" min="0" max="59" value="0" style="width:90px"></label>`
      : mode === "minutes" ? `<label class="f">Every<select id="bmin">${[5,10,15,20,30].map(h => `<option ${h === 15 ? "selected" : ""}>${h}</option>`).join("")}</select></label><span class="meta" style="margin-bottom:9px">minutes</span>`
      : mode === "daily" ? `<label class="f">At<input type="time" id="bt" value="02:00"></label>`
      : `<div class="days">${DOW.map(d => `<label><input type="checkbox" value="${d}" ${d === "Sun" ? "checked" : ""}>${d}</label>`).join("")}</div><label class="f">At<input type="time" id="bt" value="02:00"></label>`;
    $$("input,select", $("#bld", el)).forEach(x => x.oninput = upd); upd();
  };
  const pad = n => String(n).padStart(2, "0");
  const expr = () => {
    if (mode === "hours") return `*-*-* 00/${$("#bh", el).value}:${pad(Math.min(59, Math.max(0, +$("#bm", el).value || 0)))}:00`;
    if (mode === "minutes") return `*-*-* *:00/${$("#bmin", el).value}:00`;
    const t = ($("#bt", el).value || "02:00") + ":00";
    if (mode === "daily") return `*-*-* ${t}`;
    const days = $$(".days input:checked", el).map(x => x.value);
    return `${(days.length ? days : ["Sun"]).join(",")} *-*-* ${t}`;
  };
  const upd = () => { $("#bexpr", el).textContent = expr(); };
  $$("#mode button", el).forEach(b => b.onclick = () => { mode = b.dataset.m; $$("#mode button", el).forEach(x => x.classList.toggle("on", x === b)); bld(); });
  $("#addc", el).onclick = () => { cals.push("*-*-* 14:00:00"); drawList(); };
  $("#badd", el).onclick = () => { cals.push(expr()); drawList(); };
  $("#brep", el).onclick = () => { cals.splice(0, cals.length, expr()); drawList(); };
  drawList(); bld();
}

/* ================================================================ snapshots */
async function snapshots(arg) {
  arg = arg || {};
  try { await loadCfg(); } catch (e) { return fail(e); }
  const ids = Object.keys(S.cfg.destinations);
  if (!ids.length) { main().innerHTML = `<h1>Snapshots</h1><div class="card empty">No destinations yet.</div>`; return; }
  const dest = arg.dest || S.snapDest || ids[0]; S.snapDest = dest;
  const tagOpts = [...new Set(Object.values(S.cfg.jobs).filter(j => j.destination === dest).map(j => j.tag))];
  main().innerHTML = `<div class="row"><h1>Snapshots</h1><span class="spacer"></span>
      <select id="ds">${ids.map(id => `<option value="${esc(id)}" ${id === dest ? "selected" : ""}>${esc(S.cfg.destinations[id].name)}</option>`).join("")}</select>
      <select id="tg"><option value="">All tags</option>${tagOpts.map(t => `<option ${arg.tag === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <button class="btn" id="rf">Refresh</button></div>
    <p class="sub">Click a snapshot to browse its files, download them, or restore them.</p><div class="card" id="sc"><div class="empty">Reading the repository…</div></div>`;
  $("#ds").onchange = () => snapshots({ dest: $("#ds").value });
  $("#tg").onchange = () => snapshots({ dest, tag: $("#tg").value });
  $("#rf").onclick = () => snapshots({ dest, tag: $("#tg").value, refresh: true });
  let sn; try { sn = await api(`/api/snapshots?dest=${dest}` + (arg.refresh ? "&refresh=1" : "")); } catch (e) { $("#sc").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (S.view !== "snapshots") return;
  const tag = $("#tg").value; if (tag) sn = sn.filter(s => (s.tags || []).includes(tag));
  if (!sn.length) { $("#sc").innerHTML = `<div class="empty">No snapshots${tag ? " with that tag" : ""}.</div>`; return; }
  $("#sc").innerHTML = `<table><thead><tr><th>Time</th><th>ID</th><th>Tags · host</th><th>Paths</th><th class="num">Size</th><th class="num">Added</th><th class="num">Files</th><th></th></tr></thead><tbody>
    ${sn.map((s, i) => { const m = s.summary || {}; const prev = sn.slice(i + 1).find(p => JSON.stringify(p.tags) === JSON.stringify(s.tags) && p.hostname === s.hostname);
      return `<tr class="click" data-i="${i}"><td class="nw">${fmtTime(s.time)}<div class="meta">${rel(s.time)}</div></td><td class="mono">${esc(s.short_id)}</td>
      <td>${(s.tags || []).map(esc).join(", ")}<div class="meta">${esc(s.hostname)}</div></td><td class="mono">${(s.paths || []).map(esc).join("<br>")}</td>
      <td class="num">${B(m.total_bytes_processed)}</td><td class="num">${B(m.data_added)}</td><td class="num">${m.total_files_processed ? (+m.total_files_processed).toLocaleString() : "–"}</td>
      <td class="num">${prev ? `<button class="btn sm" data-diff="${i}" data-prev="${esc(prev.id)}">Diff</button> ` : ""}<button class="btn sm danger" data-forget="${i}">Forget</button></td></tr>`; }).join("")}</tbody></table>`;
  $$("tr[data-i]").forEach(tr => tr.onclick = e => { if (e.target.closest("button")) return; go("browse", { dest, snap: sn[+tr.dataset.i], path: "/" }); });
  $$("[data-diff]").forEach(b => b.onclick = async () => { try { const t = await api("/api/tasks", { kind: "diff", dest, a: b.dataset.prev, b: sn[+b.dataset.diff].id }); go("task", t.id); } catch (e) { fail(e); } });
  $$("[data-forget]").forEach(b => b.onclick = async () => { const s = sn[+b.dataset.forget];
    if (!await confirmBox(`Forget snapshot ${s.short_id}?`, `Removes the snapshot from ${esc(fmtTime(s.time))}. Its data is freed by the next prune. This cannot be undone.`, "Forget snapshot", true)) return;
    try { const t = await api("/api/tasks", { kind: "forget_snapshot", dest, snapshot: s.id }); go("task", t.id); } catch (e) { fail(e); } });
}
async function browse(arg) {
  S.browse = arg; const { dest, snap, path } = arg;
  const parts = path.split("/").filter(Boolean);
  const crumbs = [`<a data-p="/">/</a>`].concat(parts.map((p, i) => `<a data-p="${esc("/" + parts.slice(0, i + 1).join("/"))}">${esc(p)}</a>`)).join(`<span class="meta">/</span>`);
  main().innerHTML = `<div class="row"><button class="btn sm" id="back">← Snapshots</button><h1 style="margin:0">Snapshot <span class="mono">${esc(snap.short_id)}</span></h1>
    <span class="meta">${fmtTime(snap.time)} · ${esc(destName(dest))}</span><span class="spacer"></span><button class="btn" id="rdir">${path === "/" ? "Restore everything…" : "Restore this folder…"}</button></div>
    <div class="card" style="margin-top:14px"><div class="crumbs">${crumbs}</div></div><div class="card" id="ls" style="margin-top:14px"><div class="empty">Listing ${esc(path)}…</div></div>`;
  $("#back").onclick = () => go("snapshots", { dest });
  $("#rdir").onclick = () => restoreDialog(dest, snap, path, "dir");
  $$(".crumbs a").forEach(a => a.onclick = () => go("browse", { dest, snap, path: a.dataset.p }));
  let items; try { items = await api(`/api/ls?dest=${dest}&snapshot=${snap.id}&path=${encodeURIComponent(path)}`); } catch (e) { $("#ls").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (S.view !== "browse" || S.browse !== arg) return;
  if (!items.length) { $("#ls").innerHTML = `<div class="empty">Empty folder.</div>`; return; }
  $("#ls").innerHTML = `<table><thead><tr><th>Name</th><th class="num">Size</th><th>Modified</th><th></th></tr></thead><tbody>
    ${items.map((n, i) => `<tr class="${n.type === "dir" ? "click" : ""}" data-n="${i}"><td><span class="icon">${n.type === "dir" ? "📁" : n.type === "symlink" ? "↪" : "📄"}</span> ${esc(n.name)}</td>
      <td class="num">${n.type === "file" ? B(n.size) : ""}</td><td class="nw">${fmtTime(n.mtime)}</td>
      <td class="num">${n.type !== "symlink" ? `<button class="btn sm" data-dl="${i}">Download</button> <button class="btn sm" data-rs="${i}">Restore…</button>` : ""}</td></tr>`).join("")}</tbody></table>`;
  $$("tr[data-n]").forEach(tr => tr.onclick = e => { if (e.target.closest("button")) return; const n = items[+tr.dataset.n]; if (n.type === "dir") go("browse", { dest, snap, path: n.path }); });
  $$("[data-dl]").forEach(b => b.onclick = () => { const n = items[+b.dataset.dl];
    location.href = `/api/dump?dest=${dest}&snapshot=${snap.id}&path=${encodeURIComponent(n.path)}${n.type === "dir" ? "&dir=1" : ""}`; toast(n.type === "dir" ? "Preparing zip…" : "Downloading…"); });
  $$("[data-rs]").forEach(b => b.onclick = () => { const n = items[+b.dataset.rs]; restoreDialog(dest, snap, n.path, n.type); });
}
function restoreDialog(dest, snap, path, type) {
  const roots = S.cfg.settings.restore_roots || [];
  const stamp = new Date(snap.time).toISOString().slice(0, 16).replace(/[:T]/g, "-");
  const sep = P().sep || "/", def = roots.length ? `${roots[0].replace(/[\\/]$/, "")}${sep}Restores${sep}${snap.short_id}_${stamp}` : "";
  modal(`<h2>Restore ${type === "dir" ? "folder" : "file"}</h2>
    <p class="sub">Copies <span class="mono">${esc(path)}</span> from snapshot <span class="mono">${esc(snap.short_id)}</span> into a new folder, keeping its full path inside it. Nothing on the live system is overwritten.</p>
    <label class="f">Restore into (a new or empty folder inside ${roots.map(r => `<span class="mono">${esc(r)}</span>`).join(" or ") || "a restore folder from Settings"})<input type="text" id="tgt" class="mono-in" value="${esc(def)}"></label>
    <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Restore</button></div>`,
    (m, close) => { $("[data-x]", m).onclick = close;
      $("[data-ok]", m).onclick = async () => {
        try { const t = await api("/api/tasks", { kind: "restore", dest, snapshot: snap.id, path, type, target: $("#tgt", m).value.trim() }); close(); go("task", t.id); } catch (e) { fail(e); } }; });
}

/* ================================================================ runs */
async function runs(jid) {
  try { await loadCfg(); } catch (e) { return fail(e); }
  const ids = Object.keys(S.cfg.jobs);
  if (!ids.length) { main().innerHTML = `<h1>Run history</h1><div class="card empty">No jobs yet.</div>`; return; }
  jid = jid && S.cfg.jobs[jid] ? jid : S.runsJob && S.cfg.jobs[S.runsJob] ? S.runsJob : ids[0]; S.runsJob = jid;
  main().innerHTML = `<div class="row"><h1>Run history</h1><span class="spacer"></span><select id="js">${ids.map(id => `<option value="${esc(id)}" ${id === jid ? "selected" : ""}>${esc(S.cfg.jobs[id].name)}</option>`).join("")}</select></div>
    <p class="sub">Every run in the last 90 days. Click one for its full log.</p><div class="card" id="rc"><div class="empty">Loading…</div></div>`;
  $("#js").onchange = () => go("runs", $("#js").value);
  let rs; try { rs = await api(`/api/runs?job=${jid}&days=90`); } catch (e) { return fail(e); }
  if (S.view !== "runs") return;
  S.lastRuns = rs;
  const ok = rs.filter(r => r.status === "success" || r.status === "warning").length;
  $("#rc").innerHTML = !rs.length ? `<div class="empty">No runs yet.</div>` : `<div class="meta" style="margin:0 0 8px 10px">${ok} of ${rs.length} succeeded</div>
    <table><thead><tr><th>Started</th><th>Result</th><th class="num">Duration</th><th class="num">Added</th><th>Files new / changed</th><th>Snapshot</th></tr></thead><tbody>
    ${rs.map(r => `<tr class="click" data-run="${r.id}"><td class="nw">${fmtTime(r.start)}</td><td>${statusChip(r.status)}</td><td class="num">${dur(r.end - r.start)}</td>
      <td class="num">${r.added ? esc(r.added[0]) : "–"}</td><td>${r.files ? `${(+r.files[0]).toLocaleString()} / ${(+r.files[1]).toLocaleString()}` : `<span class="meta">${esc((r.error_msg || "–").replace(/^\[[^\]]+\]\s*/, "").slice(0, 90))}</span>`}</td>
      <td class="mono">${esc(r.snapshot || "–")}</td></tr>`).join("")}</tbody></table>`;
  $$("tr[data-run]").forEach(tr => tr.onclick = () => go("runlog", { job: jid, id: tr.dataset.run }));
}
async function runlog({ job, id }) {
  const r = (S.lastRuns || []).find(x => x.id === id);
  main().innerHTML = `<div class="row"><button class="btn sm" id="back">← Run history</button><h1 style="margin:0">${esc(((S.cfg && S.cfg.jobs[job]) || {}).name || job)}</h1>${r ? statusChip(r.status) : ""}</div>
    <p class="sub" style="margin-top:8px">${r ? `${fmtTime(r.start)} · ${dur(r.end - r.start)} · ` : ""}<span class="mono">${esc(id)}</span></p>
    <pre class="log" id="full" style="max-height:calc(100vh - 170px)">Loading…</pre>`;
  $("#back").onclick = () => go("runs", job);
  let cursor = null, lines = [];
  const pull = async () => {
    try { const x = await api(`/api/runlog?job=${job}&id=${id}` + (cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""));
      cursor = x.cursor; if (!x.lines.length && lines.length) return;
      const first = !lines.length;
      lines = lines.concat(x.lines.map(l => `<span style="opacity:.55">${new Date(l.t * 1000).toLocaleTimeString()}</span>  ${colorLine(l.m)}`));
      const pre = $("#full"); if (!pre) return; const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
      pre.innerHTML = lines.join("\n") || "(no output yet)"; if (atBottom || first) pre.scrollTop = pre.scrollHeight;
    } catch (e) { } };
  await pull(); timers.push(setInterval(pull, 3000));
}

/* ================================================================ activity (tasks) */
async function activity() {
  main().innerHTML = `<h1>Activity</h1><p class="sub">Repository tasks started from this app since the service last started: checks, prunes, restores, diffs.</p><div class="card" id="tl"><div class="empty">Loading…</div></div>`;
  const draw = async () => { try { const ts = await api("/api/tasks"); if (S.view !== "activity") return;
    $("#tl").innerHTML = ts.length ? `<table><thead><tr><th>Task</th><th>Status</th><th>Started</th><th class="num">Duration</th></tr></thead><tbody>
      ${ts.map(t => `<tr class="click" data-t="${t.id}"><td>${esc(t.title)}</td><td>${statusChip(t.status)}</td><td class="nw">${fmtTime(t.started)}</td><td class="num">${dur((t.ended || Date.now() / 1000) - t.started)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">Nothing yet.</div>`;
    $$("[data-t]").forEach(tr => tr.onclick = () => go("task", tr.dataset.t)); } catch (e) { } };
  draw(); timers.push(setInterval(draw, 4000));
}
async function taskView(id) {
  main().innerHTML = `<div class="row"><button class="btn sm" id="back">← Activity</button><h1 style="margin:0" id="tt">Task</h1><span id="ts"></span><span class="spacer"></span>
    <button class="btn danger" id="cancel" style="display:none">Cancel</button></div><p class="sub" id="tm" style="margin-top:8px"></p><div id="tr"></div>
    <pre class="log" id="to" style="max-height:calc(100vh - 210px)">Starting…</pre>`;
  $("#back").onclick = () => go("activity");
  let lines = [];
  const pull = async () => {
    let t; try { t = await api(`/api/task?id=${id}&from=${lines.length}`); } catch (e) { return; }
    if (S.view !== "task") return;
    lines = lines.concat(t.lines);
    $("#tt").textContent = t.title; $("#ts").innerHTML = statusChip(t.status);
    $("#tm").textContent = `Started ${fmtTime(t.started)} · ${dur((t.ended || Date.now() / 1000) - t.started)}` + (t.rc != null ? ` · exit ${t.rc}` : "");
    $("#cancel").style.display = t.status === "running" ? "" : "none";
    const pre = $("#to"), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    pre.innerHTML = lines.map(colorLine).join("\n"); if (atBottom) pre.scrollTop = pre.scrollHeight;
    if (t.status === "done" && t.result) {
      if (t.kind === "restore") $("#tr").innerHTML = `<div class="banner info">Restored into <span class="mono">${esc(t.result.target)}${esc(t.result.path === "/" ? "" : t.result.path)}</span></div>`;
      if (t.kind === "init") { $("#tr").innerHTML = `<div class="banner info">Repository created and added as a destination. Save its password now (Show password on the destination). <button class="btn sm" id="gd">Go to Destinations</button></div>`; $("#gd").onclick = () => go("destinations"); }
    }
    if (t.status !== "running" && t.status !== "queued") clearTimers();
  };
  $("#cancel").onclick = async () => { try { await api("/api/task/cancel", { id }); } catch (e) { fail(e); } };
  await pull(); timers.push(setInterval(pull, 1500));
}

/* ================================================================ settings */
async function settingsView() {
  main().innerHTML = `<h1>Settings</h1><p class="sub">Where alerts go, and where restores may be written.</p><div id="sv"></div>`;
  try { await loadCfg(); } catch (e) { return fail(e); }
  const st = S.cfg.settings, n = st.notifications, d = n.desktop, e = n.email, w = n.webhook;
  $("#sv").innerHTML = `<div class="stack">
    <div class="card"><div class="row"><h2 style="margin:0">Desktop notifications</h2><span class="spacer"></span><button class="btn sm" data-test="desktop">Send test</button></div>
      <label class="cb" style="margin-top:12px"><input type="checkbox" id="de" ${d.enabled ? "checked" : ""}> Show a desktop notification</label>
      <label class="f" style="margin-top:10px;max-width:280px">For user<input type="text" id="du" value="${esc(d.user || st.desktop_user)}"></label>
      <div class="meta">Reaches the user only while they are signed in${WIN() ? " (as a Windows notification; enter the Windows user name, or DOMAIN\\name)" : " to a desktop session"}.</div></div>
    <div class="card"><div class="row"><h2 style="margin:0">Email</h2><span class="spacer"></span><button class="btn sm" data-test="email">Send test</button></div>
      <label class="cb" style="margin-top:12px"><input type="checkbox" id="ee" ${e.enabled ? "checked" : ""}> Send alert emails</label>
      <div class="form-2" style="margin-top:12px">
        <label class="f">SMTP server<input type="text" id="eh" value="${esc(e.host)}" placeholder="smtp.example.com"></label>
        <div class="row" style="gap:10px;align-items:flex-end;flex-wrap:nowrap"><label class="f" style="flex:1">Security<select id="es">${[["starttls","STARTTLS"],["ssl","SSL/TLS"],["none","None"]].map(([v, l]) => `<option value="${v}" ${e.security === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="f" style="width:90px">Port<input type="number" id="ep" value="${esc(e.port)}"></label></div>
        <label class="f">Username<input type="text" id="eu" value="${esc(e.username)}" autocomplete="off"></label>
        <label class="f">Password<input type="password" id="epw" placeholder="${e.has_password ? "saved; leave blank to keep" : ""}" autocomplete="new-password"></label>
        <label class="f">From<input type="email" id="ef" value="${esc(e.from)}" placeholder="backups@example.com"></label>
        <label class="f">To (comma-separated)<input type="text" id="et" value="${esc((e.to || []).join(", "))}" placeholder="you@example.com"></label></div>
      <div class="meta" style="margin-top:8px">The password goes in an admin-only file, never in the config.</div></div>
    <div class="card"><div class="row"><h2 style="margin:0">Webhook</h2><span class="spacer"></span><button class="btn sm" data-test="webhook">Send test</button></div>
      <label class="cb" style="margin-top:12px"><input type="checkbox" id="we" ${w.enabled ? "checked" : ""}> Post alerts to a webhook</label>
      <label class="f" style="margin-top:10px">Slack, Mattermost or Discord incoming-webhook URL<input type="text" id="wu" class="mono-in" value="${esc(w.url)}" placeholder="https://hooks.slack.com/services/…"></label></div>
    <div class="card"><h2>Restores</h2><label class="f">Folders restores may write into, one per line<textarea id="rr" style="min-height:70px">${esc((st.restore_roots || []).join("\n"))}</textarea></label>
      <label class="f" style="margin-top:10px;max-width:280px">${P().features.chown ? "Restored files are owned by" : "Desktop user"}<input type="text" id="ru" value="${esc(st.desktop_user)}"></label></div>
    </div><div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn primary" id="save">Save settings</button></div>`;
  const body = () => ({ desktop_user: $("#ru").value.trim(), restore_roots: $("#rr").value.split("\n"),
    notifications: { desktop: { enabled: $("#de").checked, user: $("#du").value.trim() },
      email: { enabled: $("#ee").checked, host: $("#eh").value.trim(), port: +$("#ep").value, security: $("#es").value, username: $("#eu").value.trim(),
        password: $("#epw").value || undefined, from: $("#ef").value.trim(), to: $("#et").value.split(",") },
      webhook: { enabled: $("#we").checked, url: $("#wu").value.trim() } } });
  $("#es").onchange = () => { $("#ep").value = { starttls: 587, ssl: 465, none: 25 }[$("#es").value]; };
  $("#save").onclick = async () => { try { await api("/api/settings", body()); toast("Settings saved"); settingsView(); } catch (er) { fail(er); } };
  $$("[data-test]").forEach(b => b.onclick = async () => { b.disabled = true;
    try { await api("/api/settings", body()); const r = await api("/api/notify/test", { channel: b.dataset.test }); toast("Test sent: " + r.detail); } catch (er) { fail(er); } b.disabled = false; });
}

/* ================================================================ login + boot */
async function renderLogin() {
  clearTimers();
  if (!S.hello) { try { S.hello = (await (await fetch("/api/hello")).json()).platform; } catch (e) { } }
  $("#root").innerHTML = `<div class="login card"><div class="row"><img src="icon.svg" width="32" alt=""><h1 style="margin:0">Restic Console</h1></div>
    <p class="sub" style="margin-top:10px">Open this from the <b>Restic Console</b> app in your ${WIN() ? "Start menu" : "launcher"}; it signs you in automatically.
    Or paste the token from <span class="mono">${esc(P().token_file || "the token file")}</span>${WIN() ? " (open it as an administrator)" : ""}:</p>
    <div class="row"><input type="text" id="tok" style="flex:1" placeholder="token"><button class="btn primary" id="go">Sign in</button></div></div>`;
  $("#go").onclick = async () => { try { await api("/api/login", { token: $("#tok").value.trim() }); boot(); } catch (e) { toast(e.message, true); } };
}
async function boot() {
  const h = location.hash, code = (h.match(/code=([0-9a-f]+)/) || [])[1], want = (h.match(/[#&]v=(\w+)/) || h.match(/^#(\w+)$/) || [])[1];
  if (code) { try { await api("/api/login", { code }); } catch (e) { } history.replaceState(null, "", location.pathname); }
  try { await loadCfg(); } catch (e) { return; }
  shell();
  const editJob = (h.match(/[#&]job=([a-z0-9-]+)/) || [])[1];
  if (editJob) return go("jobedit", editJob);
  go(VIEWS.some(x => x[0] === want) ? want : "overview");
}
boot();
</script>
